name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    uses: 42-Cursus-treig/.github/.github/workflows/node-ci.yml@main
    with:
      node_version: "22"
      working_directory: "."
      run_lint: true
      run_tests: false
      run_build: true

  worker:
    name: Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Worker bundle
        run: npx wrangler deploy --dry-run --outdir dist
