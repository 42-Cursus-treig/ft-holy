name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; les pushes qui s'enchaînent ne se doublent pas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le build n'a besoin d'aucune variable pour l'instant : le Device Flow
      # GitHub est inopérant tant que DEVICE_PROXY est vide dans
      # src/hooks/useGitHubAuth.js, donc VITE_GITHUB_CLIENT_ID ne sert à rien.
      # Le jour où le proxy existe, définis la variable dans
      # Settings → Secrets and variables → Actions → Variables, puis :
      #   env:
      #     VITE_GITHUB_CLIENT_ID: ${{ vars.VITE_GITHUB_CLIENT_ID }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4